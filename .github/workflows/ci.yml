name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo fmt --check
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check licenses
  validity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: DOC_MERGE_OUT="$RUNNER_TEMP/out" cargo test --locked --test office -- --ignored
      - name: LibreOffice converts every merged file
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui
          soffice --headless --convert-to pdf --outdir "$RUNNER_TEMP/pdf" "$RUNNER_TEMP/out"/*
          for f in "$RUNNER_TEMP/out"/*; do
            test -s "$RUNNER_TEMP/pdf/$(basename "${f%.*}").pdf"
          done
      - name: The Open XML SDK finds nothing in them that the inputs lacked
        run: |
          mkdir "$RUNNER_TEMP/check" && cd "$RUNNER_TEMP/check"
          dotnet new console --force
          dotnet add package DocumentFormat.OpenXml --version 3.5.1
          cat > Program.cs <<'CS'
          using DocumentFormat.OpenXml;
          using DocumentFormat.OpenXml.Packaging;
          using DocumentFormat.OpenXml.Validation;
          var validator = new OpenXmlValidator(FileFormatVersions.Microsoft365);
          List<(string Text, string Where)> Errors(string path)
          {
              using OpenXmlPackage doc = Path.GetExtension(path) switch
              {
                  ".xlsx" => SpreadsheetDocument.Open(path, false),
                  ".pptx" => PresentationDocument.Open(path, false),
                  _ => WordprocessingDocument.Open(path, false),
              };
              return validator.Validate(doc)
                  .Select(e => (e.Description, $"{e.Part?.Uri} {e.Path?.XPath}")).ToList();
          }
          var known = new[] { "*.docx", "*.xlsx", "*.pptx" }
              .SelectMany(p => Directory.GetFiles(args[0], p)).SelectMany(Errors)
              .Select(e => e.Text).ToHashSet();
          var failed = false;
          foreach (var path in Directory.GetFiles(args[1]))
          {
              foreach (var e in Errors(path).Where(e => !known.Contains(e.Text)))
              {
                  failed = true;
                  Console.WriteLine($"{Path.GetFileName(path)}: {e.Where}: {e.Text}");
              }
          }
          return failed ? 1 : 0;
          CS
          dotnet run -- "$GITHUB_WORKSPACE/tests/fixtures" "$RUNNER_TEMP/out"
