[package]
name = "doc-merge"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Merge Word, PowerPoint or Excel files into one, keeping their layouts and formatting"
repository = "https://github.com/nowmyagentcan/doc-merge"
publish = false

[profile.release]
lto = true
codegen-units = 1
strip = true

# Deflate in unoptimised builds makes the package tests slow.
[profile.dev.package."*"]
opt-level = 3

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
quick-xml = "=0.42.0"
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
# MCP results keep the CLI's key order (indexmap is already in the graph through rmcp).
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt"] }
zip = { version = "=9.2.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }
